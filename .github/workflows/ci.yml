name: Offline automation and report checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated examples
        run: python tools/build_demo.py --check
      - name: Test automation controls, reference metrics, and SQL result SELECTs
        run: python -m unittest discover -s tests -v
      - name: Run the public demo
        run: python -m qdb_impact
